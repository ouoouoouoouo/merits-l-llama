# Stage III fusion — Llama LoRA (no pretrain) text + HuBERT audio.
#
# Ablation: replaces CARE with vanilla HuBERT. Directly comparable to:
#   Llama LoRA + CARE:          fusion 0.8567 ± 0.0139 (best 0.8746)
#   Llama LoRA + Vanilla WavLM: fusion 0.8504 ± 0.0075 (best 0.8577)
#
# Prerequisite: copy HuBERT Stage II utt hidden from merits-l-text:
#   cp /home/ouo/merits-l-text/data/cache/iemocap_audio_hubert_stage2_utt.pt \
#      data/cache/

run_name: iemocap_stage3_llama_hubert
seed: 42
output_dir: outputs/iemocap_stage3_llama_hubert

dataset:
  manifest_dir: data/manifests/iemocap
  # Llama LoRA (no pretrain) Stage II utt hidden (shared with iemocap_stage3_llama.yaml)
  text_features_path:  data/cache/iemocap_text_llama_stage2_utt.pt
  # HuBERT Stage II utt hidden (768-d = 2 * gru_hidden=384)
  audio_features_path: data/cache/iemocap_audio_hubert_stage2_utt.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  text_dim: 2048           # Llama Stage II output
  audio_dim: 768           # HuBERT Stage II output (same as Vanilla WavLM)
  hidden_dim: 256
  num_heads: 8
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-llama
  log_every: 10
